/* ===== 顶部导航栏 - 红底灰字 ===== */
.top-nav {

.nav-inner {

}

/* 品牌名（也是灰字） */
.nav-brand {
    font-size: 22px;

    color: #cccccc;                /* 灰色 */
    text-decoration: none;
    letter-spacing: 2px;
    white-space: nowrap;
    transition: color 0.3s ease;
}

.nav-brand:hover {
    color: #ffffff;                /* hover变白 */
}

/* 导航链接 - 灰色 */
.nav-links {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.nav-links a {
    color: #cccccc;                /* 灰色文字 */

    font-size: 15px;
    padding: 6px 16px;
    border-radius: 4px;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

/* 悬停时：红色加深 + 文字变白 */
.nav-links a:hover {
    background: #7a0f0f;           /* 红色加深（深红） */
    color: #ffffff;                /* 文字变白 */
}

/* 当前激活页面：也是深红底 + 白字 */
.nav-links a.active {
    background: #7a0f0f;           /* 深红底 */
    color: #ffffff;                /* 白字 */
}

/* 页面内容留出顶部空间 */
.page {
    padding-top: 80px !important;
}

/* 移动端适配 */
@media (max-width: 768px) {
    .nav-inner {

        align-items: flex-start;

    .top-nav {
        height: auto;

    }
    .nav-links {

    }
    .nav-links a {
