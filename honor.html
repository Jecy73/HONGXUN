<style>
/* ===== 顶部导航栏 - 红底灰字 ===== */
.top-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 999;
    background: #7a0f0f;           /* 红色背景 */
    border-bottom: 2px solid #8a1515;
    padding: 0 20px;
    height: 64px;
    display: flex;
    align-items: center;
}

.nav-inner {
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
}

/* 品牌名（也是灰字） */
.nav-brand {
    font-size: 22px;
    font-family: "STKaiti", serif;
    color: #cccccc;                /* 灰色 */
    text-decoration: none;
    letter-spacing: 2px;
    white-space: nowrap;
    transition: color 0.3s ease;
}

.nav-brand:hover {
    color: #ffffff;                /* hover变白 */
}

/* 导航链接 - 灰色 */
.nav-links {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.nav-links a {
    color: #cccccc;                /* 灰色文字 */
    text-decoration: none;
    font-size: 15px;
    padding: 6px 16px;
    border-radius: 4px;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

/* 悬停时：红色加深 + 文字变白 */
.nav-links a:hover {
    background: #7a0f0f;           /* 红色加深（深红） */
    color: #ffffff;                /* 文字变白 */
}

/* 当前激活页面：也是深红底 + 白字 */
.nav-links a.active {
    background: #7a0f0f;           /* 深红底 */
    color: #ffffff;                /* 白字 */
}

/* 页面内容留出顶部空间 */
.page {
    padding-top: 80px !important;
}

/* 移动端适配 */
@media (max-width: 768px) {
    .nav-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 8px 0;
    }
    .top-nav {
        height: auto;
        padding: 8px 16px;
    }
    .nav-links {
        gap: 4px;
    }
    .nav-links a {
        font-size: 13px;
        padding: 4px 12px;
    }
    .page {
        padding-top: 110px !important;
    }
}

.badge{

margin:50px auto;

4px solid #d9b15c;

font-size:28px;


color:#e5bd65;

pulse 2s infinite;

0 0 30px #d9b15c;


}


}



</style>


</head>
