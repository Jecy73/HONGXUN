<div class="text">


青岛工人运动纪念馆是山东省首个以工人运动为主题的纪念馆。


<br><br>


纪念馆位于青岛市市南区香港西路33号，

坐落于八大关近代建筑群中。


<br><br>


展馆由青岛市总工会兴办，

2021年4月29日正式开馆。


</div>





<div class="highlight">


“时代力量、走在前列”


<br>


展馆通过历史资料、

实物陈列和数字技术，

展现青岛工人运动百年奋斗历程。


</div>
